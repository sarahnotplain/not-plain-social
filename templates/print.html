<!-- PHOTO PRINT: a tilted 5x7 print holding one line, post title below.
     Best for: short lines (under ~15 words), memory/photograph/place-and-date posts.
     {{date_label}} is optional — leave it empty if the post doesn't anchor to a date or place. -->
<body style="background: var(--paper)">
  <div class="abs" style="left: 50%; top: 44%; width: 72%; aspect-ratio: 5/7; transform: translate(-50%, -50%) rotate(-2.2deg);
       background: var(--cream); padding: calc(var(--u)*4.5); box-shadow: 0 calc(var(--u)*1.4) calc(var(--u)*4) rgba(40,30,20,.22)">
    <div class="fitbox" style="height: 100%; border: 1px solid #D6CCBD; padding: calc(var(--u)*5)">
      <div class="mono" style="color: var(--rust); margin-bottom: calc(var(--u)*4)">{{date_label}}</div>
      <div class="fit" style="font-size: calc(var(--u)*6.4); line-height: 1.18">{{quote}}</div>
    </div>
  </div>

  <div class="abs" style="left: calc(var(--u)*8); right: calc(var(--u)*8); bottom: calc(var(--u)*6.5)">
    <div class="brand">{{title}}</div>
    <div class="mono" style="color: var(--muted); margin-top: calc(var(--u)*1.2)">Not Plain · {{site}}</div>
  </div>
</body>
