<!-- COVER: the post's art full-bleed, fading to near-black at the bottom, title + subtitle in serif
     (like Substack's own share image). Only when the post has a header image. -->
<body style="background: #14110E; color: var(--cream)">
  <div class="abs" style="inset: 0; background: url('{{image_src}}') center 28%/cover no-repeat; filter: saturate(.9)"></div>
  <div class="abs" style="inset: 0; background: linear-gradient(to bottom, rgba(20,17,14,0) 38%, rgba(20,17,14,.72) 64%, rgba(20,17,14,.94) 100%)"></div>

  <div class="abs fitbox" style="left: calc(var(--u)*8); right: calc(var(--u)*10); top: 52%; bottom: calc(var(--u)*27); justify-content: flex-end">
    <div class="fit" style="font-size: calc(var(--u)*8.4); line-height: 1.08; font-weight: 500">{{title}}</div>
    <div style="margin-top: calc(var(--u)*3.2); font-size: calc(var(--u)*4); line-height: 1.3; color: #E9E3D8">{{subtitle}}</div>
  </div>

  <div class="abs" style="left: calc(var(--u)*8); bottom: calc(var(--u)*16.5); font-style: italic; font-size: calc(var(--u)*3.8); color: #D8D0C4">Not Plain</div>
  <div class="abs" style="left: calc(var(--u)*8); right: calc(var(--u)*8); bottom: calc(var(--u)*7); display: flex; justify-content: space-between; align-items: center">
    <div class="mono" style="color: #B9B1A6">{{site}}</div>
    <img class="logo" src="{{logo_src}}" alt="" style="width: calc(var(--u)*8); height: calc(var(--u)*8)">
  </div>
</body>
