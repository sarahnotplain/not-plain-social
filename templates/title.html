<!-- TITLE CARD: dark, big title + italic subtitle.
     Best for: posts whose title/subtitle already carry the hook, or when no line stands alone. -->
<body style="background: var(--ink); color: var(--cream)">
  <div class="abs" style="inset: calc(var(--u)*4); border: 1px solid #4A423A"></div>

  <div class="abs mono" style="left: calc(var(--u)*9); top: calc(var(--u)*10); color: var(--sand)">Not Plain &nbsp;·&nbsp; {{label}}</div>

  <div class="abs fitbox" style="left: calc(var(--u)*9); right: calc(var(--u)*9); top: calc(var(--u)*18); bottom: calc(var(--u)*22)">
    <div class="fit" style="font-size: calc(var(--u)*10); line-height: 1.04; font-weight: 500">{{title}}</div>
    <div style="margin-top: calc(var(--u)*4); font-style: italic; font-size: calc(var(--u)*3.8); line-height: 1.35; color: #D8CFC2">{{subtitle}}</div>
  </div>

  <div class="abs" style="left: calc(var(--u)*9); right: calc(var(--u)*9); bottom: calc(var(--u)*10); display: flex; justify-content: space-between">
    <div class="mono" style="color: var(--sand)">Read the full story</div>
    <div class="mono" style="color: #8F857A">{{site}}</div>
  </div>
</body>
