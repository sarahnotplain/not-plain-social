<!-- TITLE CARD: black like her logo, the torn-kraft logo at top, big title + italic subtitle.
     Best for: posts whose title/subtitle already carry the hook, or when no line stands alone. -->
<body style="background: var(--black); color: var(--cream)">
  <img class="abs" src="{{logo_src}}" alt="" style="left: calc(var(--u)*4); top: calc(var(--u)*1); width: calc(var(--u)*26)">
  <div class="abs mono" style="right: calc(var(--u)*9); top: calc(var(--u)*11); color: var(--kraft)">{{label}}</div>

  <div class="abs fitbox" style="left: calc(var(--u)*9); right: calc(var(--u)*9); top: calc(var(--u)*27); bottom: calc(var(--u)*22)">
    <div class="fit" style="font-size: calc(var(--u)*10); line-height: 1.04; font-weight: 500">{{title}}</div>
    <div style="margin-top: calc(var(--u)*4); font-style: italic; font-size: calc(var(--u)*3.8); line-height: 1.35; color: #D8D2C8">{{subtitle}}</div>
  </div>

  <div class="abs" style="left: calc(var(--u)*9); right: calc(var(--u)*9); bottom: calc(var(--u)*10); display: flex; justify-content: space-between">
    <div class="mono" style="color: var(--kraft)">Read the full story</div>
    <div class="mono" style="color: #A7A1BD">{{site}}</div>
  </div>
</body>
