<!-- NOTE CARD: cream, upright serif text with a rust margin rule, like a page from a notebook.
     Used only for Substack Notes (label "From my notes"). {{quote}} is her exact words. -->
<body style="background: var(--cream)">
  <div class="abs" style="left: calc(var(--u)*8); top: calc(var(--u)*8)">
    <div class="mono" style="color: var(--rust)">{{label}}</div>
  </div>

  <div class="abs fitbox" style="left: calc(var(--u)*8); right: calc(var(--u)*10); top: calc(var(--u)*16); bottom: calc(var(--u)*20)">
    <div class="fit" style="font-size: calc(var(--u)*5.6); line-height: 1.3; white-space: pre-line;
         border-left: 2px solid var(--rust); padding-left: calc(var(--u)*5)">{{quote}}</div>
  </div>

  <div class="abs" style="left: calc(var(--u)*8); right: calc(var(--u)*8); bottom: calc(var(--u)*7);
       border-top: 1px solid var(--rule); padding-top: calc(var(--u)*3); display: flex; justify-content: space-between; align-items: baseline">
    <div class="brand">Not Plain</div>
    <div class="mono" style="color: var(--muted)">{{site}}</div>
  </div>
</body>
