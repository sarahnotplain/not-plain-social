<!-- MANUSCRIPT: a draft page, typed in mono on ruled paper, with her line marked in lavender highlighter.
     Best for: lines about writing, memory, or noticing something; shows the memoir being written. -->
<body style="background: #EFE9DF">
  <div class="abs" style="left: 7%; right: 7%; top: 6%; bottom: 18%; background: #FBF8F2;
       box-shadow: 0 calc(var(--u)*.6) calc(var(--u)*2.4) rgba(40,30,20,.14);
       background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--u)*5.4 - 1px), #E3DCD0 calc(var(--u)*5.4 - 1px) calc(var(--u)*5.4))">
    <div class="abs" style="left: calc(var(--u)*9); top: 0; bottom: 0; width: 1px; background: #E2B8B0"></div>
    <div class="abs mono" style="right: calc(var(--u)*5); top: calc(var(--u)*4); color: var(--muted)">{{label}}</div>
    <div class="abs fitbox" style="left: calc(var(--u)*13); right: calc(var(--u)*7); top: calc(var(--u)*12); bottom: calc(var(--u)*10)">
      <div class="fit" style="font-family: 'Plex Mono', monospace; font-size: calc(var(--u)*4.6); line-height: 1.75; color: var(--ink)">
        <span style="background: linear-gradient(transparent 12%, rgba(146,128,204,.34) 12% 88%, transparent 88%); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 .15em">{{quote}}</span>
      </div>
    </div>
  </div>
  <div class="abs" style="left: calc(var(--u)*8); right: calc(var(--u)*8); bottom: calc(var(--u)*5.5); display: flex; align-items: center; gap: calc(var(--u)*3)">
    <img class="logo" src="{{logo_src}}" alt="">
    <div>
      <div class="brand">{{title}}</div>
      <div class="mono" style="color: var(--muted); margin-top: calc(var(--u)*1)">{{site}}</div>
    </div>
  </div>
</body>
